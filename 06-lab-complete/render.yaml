services:
  - type: web
    name: day14-production-agent
    runtime: docker
    plan: free
    region: singapore
    # Agent nằm trong thư mục con, đường dẫn tính từ gốc repo.
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []   # chỉ cho service trong cùng tài khoản Render kết nối nội bộ
